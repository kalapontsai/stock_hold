<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登入 · stock_hold</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./css/tokens.css">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/components.css">
  <!-- F-12: Cloudflare Turnstile widget. {{TURNSTILE_SITEKEY}} is substituted -->
  <!-- at build time by scripts/package.sh from the STOCK_HOLD_TURNSTILE_SITEKEY -->
  <!-- env var. If left empty (dev mode), widget renders inert; backend -->
  <!-- verify_turnstile() also skips check when STOCK_HOLD_TURNSTILE_SECRET -->
  <!-- is empty. Visible mode: user explicitly checks the CAPTCHA box. -->
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body>
  <script>
    // F-12: Turnstile token store. auth.js reads window.__turnstileToken when
    // submitting login/register. Updated by the widget's data-callback.
    window.__turnstileToken = '';
    window.onTurnstileSuccess = function (token) { window.__turnstileToken = token; };
  </script>
  <main class="auth-page">
    <section class="modal-card auth-card" aria-labelledby="auth-title">
      <h1 id="auth-title">stock_hold</h1>
      <p class="auth-card__hint">登入你的股票與資產帳簿</p>
      <div class="tabs" role="tablist">
        <button class="btn btn--primary" type="button" data-mode="login" aria-selected="true">登入</button>
        <button class="btn btn--ghost" type="button" data-mode="register" aria-selected="false">註冊</button>
      </div>
      <form id="auth-form" novalidate>
        <label class="form-field">帳號或 Email<input name="identity" autocomplete="username" required></label>
        <label class="form-field" data-register-only hidden>使用者名稱<input name="username" autocomplete="username"></label>
        <label class="form-field" data-register-only hidden>Email<input name="email" type="email" autocomplete="email"></label>
        <label class="form-field">密碼<input name="password" type="password" autocomplete="current-password" required></label>
        <label class="form-field" data-register-only hidden>確認密碼<input name="password_confirm" type="password" autocomplete="new-password"></label>
        <!-- F-12: Turnstile widget — sitekey substituted at build time by scripts/package.sh -->
        <div class="cf-turnstile" data-sitekey="{{TURNSTILE_SITEKEY}}" data-callback="onTurnstileSuccess"></div>
        <p id="auth-message" class="form-error" role="alert" hidden></p>
        <button class="btn btn--primary" type="submit" id="auth-submit">登入</button>
      </form>
    </section>
  </main>
  <script type="module" src="./js/auth.js"></script>
</body>
</html>
